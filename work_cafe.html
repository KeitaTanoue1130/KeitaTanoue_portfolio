<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>カフェサイト制作</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- header（indexと同じものをコピペ） -->
    <header class="header-container">
        <div class="header-logo">
            <a href="index.html"><img src="./image/logo.png" alt="ロゴ"></a>
        </div>
        <nav>
            <ul class="header-nav">
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#skills">Skills</a></li>
                <li><a href="index.html#works">Works</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="wrapper">

        <!-- タイトル -->
        <section class="work-detail">
            <h1>カフェサイト制作</h1>
            <p class="work-lead">
                女性ユーザーをターゲットに、居心地の良さと導線設計を意識したカフェサイトを制作しました。
            </p>

            <!-- FV -->
            <div class="work-visual">

                <div class="visual-item">
                    <p class="visual-label">PC</p>

                    <a href="https://keitatanoue1130.github.io/cafe_style/" target="_blank" rel="noopener">
                        <img src="./work/webサイト/cafe_dtp.png" alt="カフェサイト PC表示">
                    </a>

                </div>

                <div class="visual-item">
                    <p class="visual-label">Mobile</p>
                    <img src="./work/webサイト/cafe_mobil.png" alt="カフェサイト スマホ表示">
                </div>

            </div>

            <!-- 概要 -->
            <ul class="work-info">
                <ul class="work-info">
                    <li><strong>制作目的：</strong>カフェの集客向上</li>
                    <li><strong>ターゲット：</strong>20〜30代女性</li>
                    <li><strong>担当範囲：</strong>デザイン / コーディング</li>
                    <li><strong>制作期間：</strong>約1日</li>
                </ul>
            </ul>

            <!-- 工夫 -->
            <div class="work-section">
                <section class="work-section">
                    <h2>工夫した点</h2>
                    <p>
                        ファーストビューでは温かみのあるビジュアルを使用し、
                        ユーザーが安心感を持てるよう設計しました。
                        また、CTAボタンを目立たせることで、予約への導線を強化しています。
                    </p>
                </section>
            </div>

        </section>

    </div>

</body>

</html>
